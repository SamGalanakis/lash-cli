[workspace]
members = [
    "crates/lash-autoresearch",
    "crates/lash-cli",
    "crates/lash-cli-perf",
    "crates/lash-debug-cli-harness",
    "crates/lash-export",
    "crates/lash-file-index",
    "crates/lash-search-tools",
    "crates/lash-tui",
    "crates/lash-tui-extensions",
]
default-members = ["crates/lash-cli"]
resolver = "3"

[workspace.package]
version = "0.0.0-dev"
license = "MIT"
edition = "2024"
authors = ["Samuel Galanakis"]
repository = "https://github.com/SamGalanakis/lash-cli"
homepage = "https://github.com/SamGalanakis/lash-cli"
documentation = "https://github.com/SamGalanakis/lash-cli"
readme = "README.md"
rust-version = "1.90"

[workspace.metadata.release]
channel = "0.1.0-alpha"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
clap = "4"
futures-util = "0.3"
pulldown-cmark = "0.13"
reqwest = { version = "0.13", default-features = false }
regex = "1"
schemars = "0.8"
serde = "1"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = "1"
tokio-util = "0.7"
tracing = "0.1"
uuid = "1"

# The CLI tracks one reviewed Lash release. Dependency updates are explicit,
# testable compatibility changes rather than an implicit lockstep workspace.
lash = { package = "lash-runtime", git = "https://github.com/Ascending-AI/lash.git", rev = "bc28978d2" }
lash-core = { git = "https://github.com/Ascending-AI/lash.git", rev = "bc28978d2" }
lash-lashlang-runtime = { git = "https://github.com/Ascending-AI/lash.git", rev = "bc28978d2" }
lash-llm-tools = { git = "https://github.com/Ascending-AI/lash.git", rev = "bc28978d2" }
lash-plugin-mcp = { git = "https://github.com/Ascending-AI/lash.git", rev = "bc28978d2" }
# lash-plugin-plan-mode removed upstream
# lash-plugin-plan-mode = { git = "https://github.com/Ascending-AI/lash.git", rev = "bc28978d2" }
lash-plugin-process-controls = { git = "https://github.com/Ascending-AI/lash.git", rev = "bc28978d2" }
lash-protocol-rlm = { git = "https://github.com/Ascending-AI/lash.git", rev = "bc28978d2" }
lash-protocol-standard = { git = "https://github.com/Ascending-AI/lash.git", rev = "bc28978d2" }
lash-provider-anthropic = { git = "https://github.com/Ascending-AI/lash.git", rev = "bc28978d2" }
lash-provider-auth = { git = "https://github.com/Ascending-AI/lash.git", rev = "bc28978d2" }
lash-provider-google = { git = "https://github.com/Ascending-AI/lash.git", rev = "bc28978d2" }
lash-provider-openai = { git = "https://github.com/Ascending-AI/lash.git", rev = "bc28978d2" }
lash-rlm-types = { git = "https://github.com/Ascending-AI/lash.git", rev = "bc28978d2" }
lash-sqlite-store = { git = "https://github.com/Ascending-AI/lash.git", rev = "bc28978d2" }
lash-standard-plugins = { git = "https://github.com/Ascending-AI/lash.git", rev = "bc28978d2" }
lash-subagents = { git = "https://github.com/Ascending-AI/lash.git", rev = "bc28978d2" }
lash-tool-support = { git = "https://github.com/Ascending-AI/lash.git", rev = "bc28978d2" }
lash-trace = { git = "https://github.com/Ascending-AI/lash.git", rev = "bc28978d2" }
lash-typescript = { git = "https://github.com/Ascending-AI/lash.git", rev = "bc28978d2" }
lashlang = { git = "https://github.com/Ascending-AI/lash.git", rev = "bc28978d2" }

lash-autoresearch = { path = "crates/lash-autoresearch" }
lash-cli-perf = { path = "crates/lash-cli-perf" }
lash-export = { path = "crates/lash-export" }
lash-file-index = { path = "crates/lash-file-index" }
lash-search-tools = { path = "crates/lash-search-tools" }
lash-tui = { path = "crates/lash-tui" }
lash-tui-extensions = { path = "crates/lash-tui-extensions" }

[profile.release]
lto = "thin"
strip = true

# Lash main pins a fuel-metered fork of regress via [patch]; downstream hosts must mirror it.
[patch.crates-io]
regress = { git = "https://github.com/Ascending-AI/lash.git", rev = "bc28978d2" }
