name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets --features lash-cli/fff-zlob --locked
      - name: Check optional CLI surfaces
        run: cargo check -p lash-cli --features bench,dhat-heap,fff-zlob,test-provider --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features lash-cli/fff-zlob --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --features lash-cli/fff-zlob --locked
      - name: Check operator scripts
        run: python3 -m py_compile scripts/*.py
      - name: Check documentation
        run: python3 scripts/check_docs.py

  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            linker: ""
            packages: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            linker: aarch64-linux-gnu-gcc
            packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
            linker: ""
            packages: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@v2
      - name: Install cross compiler
        if: runner.os == 'Linux' && matrix.packages != ''
        run: scripts/ci-install-apt-packages.sh ${{ matrix.packages }}
      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --release --locked -p lash-cli --features fff-zlob --target ${{ matrix.target }}
